<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1f44">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Quem é esse Pokémon?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ MENU ============ -->
  <section id="menu" class="screen active">
    <div class="menu-inner">
      <div class="menu-hero">
        <div class="logo">
          <h1>Quem é esse<br><span>Pokémon?</span></h1>
        </div>

        <p class="best-line">🏆 Recorde: <strong id="menuBest">0</strong></p>

        <button class="btn-primary big" id="startBtn" type="button">Jogar!</button>
        <p class="status" id="menuStatus" role="status"></p>
      </div>

      <div class="panel">
        <div class="gen-header">
          <h2>Gerações na brincadeira</h2>
          <div class="gen-actions">
            <button class="chip" id="selAll" type="button">Todas</button>
            <button class="chip" id="selNone" type="button">Limpar</button>
          </div>
        </div>
        <div class="gen-grid" id="genGrid"></div>
        <p class="pool-count" id="poolCount"></p>
      </div>
    </div>
  </section>

  <!-- ============ JOGO ============ -->
  <section id="game" class="screen">
    <header class="hud">
      <button class="icon-btn" id="backBtn" type="button" aria-label="Voltar ao menu">← Menu</button>
      <div class="score-ball" id="scoreBall" aria-label="Pontuação">
        <div class="score-ball-btn"><span id="score">0</span></div>
      </div>
      <div class="best-box"><small>Recorde</small><strong id="best">0</strong></div>
    </header>

    <div class="play">
      <div class="stage" id="stage">
        <div class="rays"></div>
        <div class="glow"></div>
        <img id="mon" alt="Pokémon misterioso" draggable="false">
        <div class="loader" id="loader"></div>
        <div class="reveal-name" id="revealName"></div>
      </div>

      <div class="answers">
        <p class="question">Quem é esse Pokémon?</p>
        <div class="options" id="options"></div>
        <p class="hint">Dica: use as teclas 1–6</p>
      </div>
    </div>
  </section>

  <!-- ============ GAME OVER ============ -->
  <div class="overlay" id="overlay" hidden>
    <div class="modal">
      <h2>Errou!</h2>
      <p class="go-mon">Era o <strong id="goName"></strong></p>
      <div class="go-score"><span id="goScore">0</span><small>pontos</small></div>
      <p class="go-record" id="goRecord"></p>
      <div class="modal-actions">
        <button class="btn-primary" id="againBtn" type="button">Jogar de novo</button>
        <button class="btn-ghost" id="menuBtn" type="button">Mudar gerações</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
